<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>어닝 트래커</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1><small data-i18n="kicker"></small><span data-i18n="title"></span></h1>
    <div class="stamp"><span data-i18n="season"></span> <b id="seasonTxt"></b><br><span data-i18n="updated"></span> <b id="updTxt"></b><br><button type="button" class="linkbtn" id="csvBtn" data-i18n="csv"></button></div>
  </header>

  <nav class="bar">
    <div class="seg" role="group" data-i18n-aria="seasonSel" id="seasonSeg"></div>
    <div class="bar-r">
      <div class="seg" role="group" data-i18n-aria="unitSel">
        <button type="button" data-unit="jo" aria-pressed="true" data-i18n="unitJo"></button><button type="button" data-unit="bil" aria-pressed="false" data-i18n="unitBil"></button>
      </div>
      <div class="seg" role="group" data-i18n-aria="langSel" id="langSeg"></div>
    </div>
  </nav>

  <section class="summary" id="summary"></section>

  <section class="sec">
    <div class="sec-head"><h2 data-i18n="tableTitle"></h2><span class="cap" id="tblCap"></span></div>
    <div class="panel scroll" id="tblWrap"><table id="tbl"></table></div>
    <div class="legend">
      <span><i class="sw up"></i><span data-i18n="lgBeat"></span></span><span><i class="sw down"></i><span data-i18n="lgMiss"></span></span>
      <span><sup class="fl derived" data-i18n="flagShort.derived"></sup><span data-i18n="lgDerived"></span></span>
      <span><sup class="fl unverified" data-i18n="flagShort.unverified"></sup><span data-i18n="lgUnverified"></span></span>
      <span><sup class="fl disputed" data-i18n="flagShort.disputed"></sup><span data-i18n="lgDisputed"></span></span>
      <span><span class="info" data-i18n="lgInfoA"></span> <span data-i18n="lgInfoB"></span></span><span data-i18n="lgCaution"></span>
    </div>
  </section>

  <section class="sec" id="hlSec" hidden>
    <div class="sec-head"><h2 data-i18n="highlightsH"></h2></div>
    <ul class="hl" id="highlights"></ul>
  </section>

  <footer class="notes" id="footer"></footer>
</div>
<script src="assets/i18n.js"></script>
<script src="assets/calc.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
