<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F161B" media="(prefers-color-scheme: dark)">
<title>어닝 트래커</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="tb-in">
    <div class="brand"><span class="logo" aria-hidden="true"></span><div><h1 data-i18n="title"></h1><span class="kicker" data-i18n="kicker"></span></div></div>
    <div class="tb-ctl">
      <div class="seg" role="group" data-i18n-aria="seasonSel" id="seasonSeg"></div>
      <label class="sel"><span class="vh" data-i18n="langSel"></span><select id="langSel"></select></label>
      <label class="sel"><span class="vh" data-i18n="unitSel"></span><select id="unitSel"></select></label>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="meta"><span id="updTxt"></span><button type="button" class="linkbtn" id="csvBtn" data-i18n="csv"></button></div>

  <section class="summary" id="summary" aria-live="polite"></section>

  <div class="duo" id="duo">
    <section class="card-sec" id="upSec" hidden>
      <h2 data-i18n="secUpcoming"></h2>
      <div id="upcoming"></div>
    </section>
    <section class="card-sec">
      <h2 data-i18n="secCompare"></h2>
      <div class="chiprow scroll-x" role="group" id="cmpTabs" data-i18n-aria="secCompare"></div>
      <div id="compare"></div>
    </section>
  </div>

  <section class="results">
    <div class="rh">
      <h2 data-i18n="secResults"></h2>
      <div class="seg wide-only" role="group" data-i18n-aria="viewSel">
        <button type="button" data-view="cards" data-i18n="viewCards"></button><button type="button" data-view="table" data-i18n="viewTable"></button>
      </div>
    </div>
    <div class="filters">
      <div class="chiprow scroll-x" role="group" id="fRegion" data-i18n-aria="fRegion"></div>
      <div class="frow">
        <div class="chiprow" role="group" id="fStatus" data-i18n-aria="fStatus"></div>
        <label class="sel small"><span data-i18n="sortLabel"></span><select id="sortSel"></select></label>
      </div>
    </div>
    <div class="cards" id="cards"></div>
    <div class="panel scroll" id="tblWrap" hidden><table id="tbl"></table></div>
    <div class="legend">
      <span><span class="pill up">▲</span> <span data-i18n="lgBeat"></span></span><span><span class="pill down">▼</span> <span data-i18n="lgMiss"></span></span>
      <span><sup class="fl derived" data-i18n="flagShort.derived"></sup> <span data-i18n="lgDerived"></span></span>
      <span><sup class="fl unverified" data-i18n="flagShort.unverified"></sup> <span data-i18n="lgUnverified"></span></span>
      <span><sup class="fl disputed" data-i18n="flagShort.disputed"></sup> <span data-i18n="lgDisputed"></span></span>
      <span data-i18n="lgCaution"></span>
    </div>
  </section>

  <section class="card-sec" id="hlSec" hidden>
    <h2 data-i18n="secNotes"></h2>
    <ul class="hl" id="highlights"></ul>
  </section>

  <footer class="foot">
    <details><summary data-i18n="methodology"></summary><div class="notes" id="footer"></div></details>
    <p class="mute" data-i18n="disclaimer"></p>
  </footer>
</main>

<dialog id="sheet" class="sheet"></dialog>

<script src="assets/i18n.js"></script>
<script src="assets/calc.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
