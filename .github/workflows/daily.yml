name: 매일 자동 갱신

# 매일 방콕 07:15 (UTC 00:15) — 미국 장 마감(방콕 03~04시) 뒤, Claude 루틴(08:50)보다 먼저.
# 1) 주가반응: 발표 후 첫 거래일 종가 기준으로 빈 값을 채움 (scripts/price_reaction.py)
# 2) 바뀐 게 있으면 검증 → 커밋 → 배포 워크플로 실행
# 3) 발표가 지났는데 반영 안 된 회사가 있으면 '실적 미입력' 이슈 (scripts/overdue.py)
on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 주가반응 수집 (Yahoo Finance 종가)
        run: python scripts/price_reaction.py --write

      - name: 검증
        run: |
          python scripts/validate.py
          python -m unittest discover -s tests

      - name: 커밋·푸시
        id: commit
        run: |
          if git diff --quiet -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "주가반응 자동 반영 ($(TZ=Asia/Bangkok date +%F))"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # 이 워크플로의 푸시는 다른 워크플로를 자동으로 깨우지 않으므로 배포를 직접 실행
      - name: 배포 실행
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: 미입력 알림 이슈
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/overdue.py > overdue.md
          if [ ! -s overdue.md ]; then exit 0; fi
          title="실적 미입력 ($(TZ=Asia/Bangkok date +%F))"
          if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body-file overdue.md
          fi
