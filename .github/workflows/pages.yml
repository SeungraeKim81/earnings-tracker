name: 검증·배포

# main에 푸시되면 검증 → 통과할 때만 GitHub Pages에 배포.
# 다른 브랜치·PR은 검증만. 저장소가 비공개면 배포는 건너뜀(docs/DEPLOY.md 참고).
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 데이터 검증
        run: python scripts/validate.py
      - name: 테스트 (화면 계산·번역 해시 일치 포함)
        run: python -m unittest discover -s tests -v

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 사이트 파일만 모으기
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
